<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>From One Lens to Another</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            display: flex;
            flex-direction: column;
            align-items: center;
            height: 100vh;
        }
        header {
            width: 100%;
            padding: 20px;
            background-color: #333;
            color: #fff;
            text-align: center;
        }
        .viewer-container {
            width: 90%;
            max-width: 1000px;
            flex-grow: 1;
            margin: 20px 0;
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>

    <header>
        <h1>From One Lens to Another</h1>
        <p>Welcome to my book showcase. Read the PDF below!</p>
    </header>

    <div class="viewer-container">
        <!-- Built-in browser PDF viewer pointing to your uploaded file -->
        <iframe src="book.pdf" type="application/pdf"></iframe>
    </div>

</body>
</html>
